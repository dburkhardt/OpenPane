name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    name: Test and package
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test --disable-sandbox

      - name: Check dependency notices
        run: ./scripts/check-third-party-notices.sh

      - name: Build ad-hoc preview bundle
        env:
          OPENPANE_BUILD_NUMBER: ${{ github.run_number }}
          OPENPANE_SIGNING_IDENTITY: "-"
        run: ./scripts/package-release.sh "0.0.${GITHUB_RUN_NUMBER}"

      - name: Validate preview bundle
        run: |
          plutil -lint dist/OpenPane.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/OpenPane.app
          codesign --display --verbose=4 dist/OpenPane.app 2>&1 | grep -q "Signature=adhoc"
          codesign --display --entitlements - --xml dist/OpenPane.app > "${RUNNER_TEMP}/openpane-entitlements.plist"
          [[ "$(plutil -extract 'com\.apple\.security\.app-sandbox' raw -o - "${RUNNER_TEMP}/openpane-entitlements.plist")" == "true" ]]
          [[ "$(plutil -extract 'com\.apple\.security\.files\.user-selected\.read-write' raw -o - "${RUNNER_TEMP}/openpane-entitlements.plist")" == "true" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSItemContentTypes:0' dist/OpenPane.app/Contents/Info.plist)" == "public.text" ]]
          file dist/OpenPane.app/Contents/MacOS/OpenPane
          otool -l dist/OpenPane.app/Contents/MacOS/OpenPane | grep -A4 LC_BUILD_VERSION
          cd dist
          shasum -a 256 -c SHA256SUMS

      - name: Upload preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OpenPane-preview-macos-arm64
          path: |
            dist/OpenPane-*-macos-arm64.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
