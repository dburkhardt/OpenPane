name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build preview release
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive version
        run: echo "OPENPANE_VERSION=${GITHUB_REF_NAME#v}" >> "${GITHUB_ENV}"

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test tagged source
        run: swift test --disable-sandbox

      - name: Package app
        env:
          OPENPANE_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package-release.sh "${OPENPANE_VERSION}"

      - name: Validate release
        run: |
          plutil -lint dist/OpenPane.app/Contents/Info.plist
          codesign --verify --deep --strict dist/OpenPane.app
          cd dist
          shasum -a 256 -c SHA256SUMS

      - name: Attest release archive
        uses: actions/attest@v4
        with:
          subject-path: dist/OpenPane-*-macos-arm64.zip

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/OpenPane-*-macos-arm64.zip \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --title "OpenPane ${GITHUB_REF_NAME}"
